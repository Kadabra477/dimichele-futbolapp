<div class="flex items-center justify-center min-h-[calc(100vh-68px)] bg-[#0f172a] px-4">
  <div class="bg-[#111827] border border-slate-800 p-8 sm:p-10 rounded-2xl shadow-2xl w-full max-w-md text-white relative overflow-hidden">
    
    <!-- Elemento decorativo superior (Estética deportiva/moderna) -->
    <div class="absolute -top-12 -right-12 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>

    <!-- Cabecera del Formulario -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-emerald-500/10 text-emerald-400 mb-3 border border-emerald-500/20 shadow-inner">
        <span class="text-2xl">⚽</span>
      </div>
      <h2 class="text-2xl font-extrabold tracking-tight text-white">FutbolApp</h2>
      <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider font-medium">Portal de Acceso y Gestión</p>
    </div>

    <!-- Mensaje de Error Visual (si ocurre alguno) -->
    @if (errorMessage) {
      <div class="mb-5 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-xs flex items-center gap-2">
        <span>⚠️</span>
        <span class="flex-1">{{ errorMessage }}</span>
      </div>
    }

    <!-- Formulario -->
    <div class="space-y-5">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Correo Electrónico</label>
        <div class="relative">
          <input type="email" [(ngModel)]="email" name="email" placeholder="ejemplo@correo.com" 
                 (keyup.enter)="iniciarSesion()"
                 class="w-full bg-[#1f2937] text-white text-sm px-4 py-3 rounded-xl border border-slate-700 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all placeholder:text-slate-500">
        </div>
      </div>
      
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Contraseña</label>
        <div class="relative">
          <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" 
                 (keyup.enter)="iniciarSesion()"
                 class="w-full bg-[#1f2937] text-white text-sm px-4 py-3 rounded-xl border border-slate-700 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all placeholder:text-slate-500">
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="pt-2 flex flex-col sm:flex-row gap-3">
        <button type="button" (click)="iniciarSesion()" [disabled]="cargando"
                class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] disabled:opacity-50 text-white text-sm font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-emerald-900/20 flex items-center justify-center gap-2">
          @if (cargando) {
            <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          }
          Ingresar
        </button>
        
        <button type="button" (click)="registrarse()" [disabled]="cargando"
                class="flex-1 bg-[#1f2937] hover:bg-slate-700 active:scale-[0.98] disabled:opacity-50 text-slate-200 text-sm font-bold py-3 px-4 rounded-xl border border-slate-700 transition-all flex items-center justify-center">
          Registrarse
        </button>
      </div>
    </div>

    <!-- Pie de tarjeta -->
    <div class="mt-8 text-center border-t border-slate-800/80 pt-4">
      <p class="text-[11px] text-slate-500">Sistema seguro respaldado por Firebase Authentication</p>
    </div>

  </div>
</div>
