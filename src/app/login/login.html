<div class="flex items-center justify-center min-h-[80vh]">
  <div class="bg-slate-800 p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-green-400 mb-6 text-center">Acceso al Sistema</h2>
    
    <div class="flex flex-col gap-4">
      <div>
        <label class="block text-slate-300 mb-1">Correo Electrónico</label>
        <input type="email" [(ngModel)]="email" class="w-full p-2 rounded bg-slate-700 text-white outline-none focus:ring-2 focus:ring-green-400">
      </div>
      
      <div>
        <label class="block text-slate-300 mb-1">Contraseña</label>
        <input type="password" [(ngModel)]="password" class="w-full p-2 rounded bg-slate-700 text-white outline-none focus:ring-2 focus:ring-green-400">
      </div>

      <div class="flex gap-4 mt-4">
        <button (click)="iniciarSesion()" class="flex-1 bg-green-600 hover:bg-green-500 text-white py-2 rounded transition-colors font-semibold">Ingresar</button>
        <button (click)="registrarse()" class="flex-1 bg-slate-600 hover:bg-slate-500 text-white py-2 rounded transition-colors font-semibold">Registrarse</button>
      </div>
    </div>
  </div>
</div>
