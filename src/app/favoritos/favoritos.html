<div class="max-w-4xl mx-auto p-6 bg-slate-800 rounded-lg shadow-lg mt-8 text-white">
  
  <!-- CABECERA CON TÍTULO Y BOTÓN DE EXPORTACIÓN A PDF CONDICIONAL -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
    <h2 class="text-3xl font-bold text-green-400">Mis Favoritos (CRUD Firestore)</h2>
    
    <button (click)="exportarPDF()" 
            [disabled]="!tieneFavoritos"
            [class.opacity-50]="!tieneFavoritos"
            [class.cursor-not-allowed]="!tieneFavoritos"
            [class.hover:bg-emerald-500]="tieneFavoritos"
            class="bg-emerald-600 text-white text-xs px-4 py-2 rounded-lg font-bold transition-colors flex items-center gap-1.5 shadow">
      📄 Exportar a PDF
    </button>
  </div>

  <!-- Formulario de Alta y Edición -->
  <div class="bg-slate-700 p-4 rounded mb-6 flex flex-wrap gap-4 items-end">
    <div class="flex-1 min-w-[200px]">
      <label class="block text-sm mb-1 text-slate-300">Nombre del Favorito</label>
      <input type="text" [(ngModel)]="nuevoNombre" placeholder="Ej: Boca Juniors, Premier League..." 
             class="w-full p-2 rounded bg-slate-600 outline-none focus:ring-2 focus:ring-green-400">
    </div>
    <div class="w-1/3 min-w-[150px]">
      <label class="block text-sm mb-1 text-slate-300">Tipo</label>
      <select [(ngModel)]="nuevoTipo" class="w-full p-2 rounded bg-slate-600 outline-none focus:ring-2 focus:ring-green-400">
        <option value="Equipo">Equipo</option>
        <option value="Liga">Liga</option>
        <option value="Jugador">Jugador</option>
      </select>
    </div>
    <button (click)="guardar()" class="bg-green-600 hover:bg-green-500 px-6 py-2 rounded font-bold transition-colors h-[40px]">
      {{ editandoId ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>

  <!-- Grilla de Resultados (Lectura / Read) -->
  <div class="grid gap-4">
    @for (fav of favoritos$ | async; track fav.id) {
      <div class="flex justify-between items-center bg-slate-700 p-4 rounded border-l-4 border-green-500">
        <div>
          <h3 class="text-xl font-bold">{{ fav.nombre }}</h3>
          <span class="text-xs font-semibold text-slate-300 bg-slate-800 px-2 py-1 rounded mt-1 inline-block">
            {{ fav.tipo }}
          </span>
        </div>
        <div class="flex gap-2">
          <button (click)="editar(fav)" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-sm transition-colors">Editar</button>
          <button (click)="eliminar(fav.id!)" class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-sm transition-colors">Eliminar</button>
        </div>
      </div>
    } @empty {
      <div class="text-center text-slate-400 p-8 border-2 border-dashed border-slate-600 rounded">
        No tienes favoritos guardados en la base de datos.
      </div>
    }
  </div>
</div>
